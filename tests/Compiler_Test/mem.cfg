; Memory layout for the cc.py example tests.
;
; Required by cc.py's boot stub: .Stack and .InterruptVector must exist so
; SET_SP $Stack.Start and SET_IVR $InterruptVector.Start resolve.
; .Kernel must exist because each compiled example emits a .Kernel block
; (those overlay; harmless dead code since main.asm is the real entry point).

; --- entry ---
.Main:             Start = 0x000000, Size = 0x000FFF ; 4KW driver code (.Main runs first)

.Stack:            Start = 0x001000, Size = 0x000FFF ; 4KW stack
.InterruptVector:  Start = 0x002000, Size = 0x0000FF ; 256W interrupt vector table
.Kernel:           Start = 0x003000, Size = 0x0000FF ; 256W (dead boot stubs from cc.py)

; --- C runtime: compiled C output and globals ---
.CCode:            Start = 0x006000, Size = 0x001FFF ; 8KW of compiled C code
.CData:            Start = 0x008000, Size = 0x000FFF ; 4KW of C globals and string literals

; --- C heap ---
; The bump allocator in heap.c hands out words starting at $Heap.Start.
; The heap grows upward toward higher addresses; it does not collide with
; the stack (which lives at .Stack and grows down toward lower addresses).
.Heap:             Start = 0x009000, Size = 0x003FFF ; 16KW dynamic-allocation region
